<!DOCTYPE html>
<html lang="pl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Gry Antka</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        :root {
            /* DOMYŚLNY MOTYW: ZIELONY */
            --bg-image: url('green.png');
            --container-bg-1: rgba(8, 45, 20, 0.85);
            --container-bg-2: rgba(3, 20, 8, 0.90);
            --border-color: rgba(0, 255, 100, 0.4);
            --shadow-color: rgba(0, 255, 100, 0.15);
            
            --title-color: #00ffcc;
            --title-shadow: rgba(0, 255, 204, 0.5);
            --subtitle-color: #a0c4de;
            
            --section-title: #ffcc00;
            --section-shadow: rgba(255, 204, 0, 0.4);
            
            --btn-bg: rgba(10, 50, 20, 0.9);
            --btn-border: rgba(0, 255, 100, 0.6);
            --btn-text: #00ffcc;
            --btn-hover-bg: rgba(0, 255, 100, 0.2);
            --btn-hover-shadow: rgba(0, 255, 100, 0.6);
            
            --mail-bg: rgba(0, 0, 0, 0.6);
            --mail-border: rgba(0, 255, 100, 0.3);
            --mail-text: #00ffcc;
            --mail-shadow: rgba(0, 255, 204, 0.4);
        }

        /* MOTYW: CZERWONY */
        body.theme-red {
            --bg-image: url('red.png');
            --container-bg-1: rgba(45, 8, 8, 0.85);
            --container-bg-2: rgba(20, 3, 3, 0.90);
            --border-color: rgba(255, 50, 50, 0.4);
            --shadow-color: rgba(255, 50, 50, 0.15);
            
            --title-color: #ff3366;
            --title-shadow: rgba(255, 51, 102, 0.5);
            --subtitle-color: #deb0b0;
            
            --section-title: #ffcc00;
            --section-shadow: rgba(255, 204, 0, 0.4);
            
            --btn-bg: rgba(50, 10, 10, 0.9);
            --btn-border: rgba(255, 50, 50, 0.6);
            --btn-text: #ff3366;
            --btn-hover-bg: rgba(255, 50, 50, 0.2);
            --btn-hover-shadow: rgba(255, 50, 50, 0.6);
            
            --mail-bg: rgba(0, 0, 0, 0.6);
            --mail-border: rgba(255, 50, 50, 0.3);
            --mail-text: #ff3366;
            --mail-shadow: rgba(255, 51, 102, 0.4);
        }

        /* MOTYW: NIEBIESKI */
        body.theme-blue {
            --bg-image: url('blue.png');
            --container-bg-1: rgba(8, 25, 45, 0.85);
            --container-bg-2: rgba(3, 10, 20, 0.90);
            --border-color: rgba(0, 150, 255, 0.4);
            --shadow-color: rgba(0, 150, 255, 0.15);
            
            --title-color: #33bbff;
            --title-shadow: rgba(51, 187, 255, 0.5);
            --subtitle-color: #b0d0de;
            
            --section-title: #ffcc00;
            --section-shadow: rgba(255, 204, 0, 0.4);
            
            --btn-bg: rgba(10, 30, 50, 0.9);
            --btn-border: rgba(0, 150, 255, 0.6);
            --btn-text: #33bbff;
            --btn-hover-bg: rgba(0, 150, 255, 0.2);
            --btn-hover-shadow: rgba(0, 150, 255, 0.6);
            
            --mail-bg: rgba(0, 0, 0, 0.6);
            --mail-border: rgba(0, 150, 255, 0.3);
            --mail-text: #33bbff;
            --mail-shadow: rgba(51, 187, 255, 0.4);
        }

        body {
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(1.35) contrast(1.05);
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .action-btn {
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--btn-text);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--btn-hover-bg);
            box-shadow: 0 0 20px var(--btn-hover-shadow);
            transform: scale(1.05);
        }

        .dropdown-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: var(--container-bg-1);
            border: 2px solid var(--btn-border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none;
            min-width: 140px;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-option {
            background: transparent;
            border: 1px solid transparent;
            color: var(--btn-text);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .dropdown-option:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-border);
        }

        .main-container {
            background: linear-gradient(135deg, var(--container-bg-1), var(--container-bg-2));
            backdrop-filter: blur(8px);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 15px var(--shadow-color);
            text-align: center;
        }

        .main-logo-container {
            margin-bottom: 15px;
            max-width: 100%;
        }

        .main-logo-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 10px var(--title-shadow));
        }

        .subtitle {
            color: var(--subtitle-color);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .game-title-logo {
            margin: 25px 0 15px 0;
            max-width: 100%;
        }

        .game-title-logo img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 10px var(--section-shadow));
        }

        .game-title-logo:first-of-type {
            margin-top: 0;
        }

        .game-wrapper {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            max-width: 100%;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .game-wrapper iframe {
            display: block;
            max-width: 100%;
            border-radius: 8px;
        }

        .footer-note {
            color: var(--subtitle-color);
            font-size: 0.95rem;
            font-style: italic;
            opacity: 0.8;
            margin-top: 15px;
        }

        .cooltext-credit {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 12px;
        }

        .cooltext-credit a {
